<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Crie sua conta na Invenire Delivery.">
    <meta name="theme-color" content="#0f9d58">
    <title>Criar conta — Invenire Delivery</title>
    <link rel="icon" href="assets/produto.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a class="pular-link" href="#conteudo">Pular para o conteúdo</a>

    <header class="topo">
        <div class="container">
            <nav class="topo-acoes" aria-label="Ações rápidas">
                <a href="index.html" class="marca">🛒 Invenire</a>
                <div class="topo-botoes">
                    <button class="botao secundario" id="alternar-tema" aria-pressed="false">🌙 Tema escuro</button>
                </div>
            </nav>
            <h1>Crie sua conta</h1>
            <p>Leva menos de um minuto.</p>
        </div>
    </header>

    <main class="container pagina-auth" id="conteudo">
        <section class="bloco cartao-auth">
            <h2>Cadastro</h2>
            <form id="form-cadastro" novalidate>
                <label>Nome completo
                    <input type="text" id="cad-nome" name="nome" required autocomplete="name" placeholder="Seu nome">
                </label>
                <label>E-mail
                    <input type="email" id="cad-email" name="email" required autocomplete="email" placeholder="voce@email.com">
                </label>
                <label>Senha
                    <input type="password" id="cad-senha" name="senha" required autocomplete="new-password" minlength="6" placeholder="Mínimo de 6 caracteres">
                </label>
                <label>Confirmar senha
                    <input type="password" id="cad-confirmar-senha" name="confirmarSenha" required autocomplete="new-password" minlength="6" placeholder="Repita a senha">
                </label>
                <p class="erro-form" id="erro-form" hidden></p>
                <button type="submit" class="botao" id="botao-cadastro">Criar conta</button>
            </form>
            <p class="texto-auxiliar-auth">
                Já tem conta? <a href="login.html">Entrar</a>
            </p>
        </section>
    </main>

    <div class="toasts" id="toasts" aria-live="polite"></div>

    <script src="auth-cliente.js"></script>
</body>
</html>
